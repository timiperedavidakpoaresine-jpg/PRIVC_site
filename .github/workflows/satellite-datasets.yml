name: Satellite dataset requests (Earth Engine)
on:
  schedule:
    - cron: "0 3 * * 3"       # Wednesdays 03:00 UTC
  workflow_dispatch: {}        # or start it by hand from the Actions tab
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install earthengine-api requests
      - env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          EE_SERVICE_ACCOUNT_JSON: ${{ secrets.EE_SERVICE_ACCOUNT_JSON }}
          EE_PROJECT: ${{ vars.EE_PROJECT }}
        run: python satellite-datasets/ee_dataset_worker.py
